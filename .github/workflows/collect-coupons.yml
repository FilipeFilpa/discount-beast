# Coleta cupons públicos 2x por dia e salva em data/coupons.json.
# Custo: zero (repositório público tem minutos ilimitados no GitHub Actions).
name: Coletar cupons

on:
  schedule:
    # A cada 3 horas (UTC). Cupons do Mercado Livre duram pouco.
    - cron: '0 */3 * * *'
  # Botão "Run workflow" na aba Actions, para rodar na hora.
  workflow_dispatch:
  # Roda também quando o código do coletor muda, para testar a mudança.
  push:
    paths:
      - 'collector/**'
      - 'lib/coupons.ts'
      - 'lib/stores.ts'
      - '.github/workflows/collect-coupons.yml'

permissions:
  contents: write # para salvar o data/coupons.json no repositório

# Nunca roda duas coletas ao mesmo tempo no mesmo branch.
concurrency:
  group: collect-coupons-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # O coletor não usa nenhuma biblioteca externa, então não precisa de npm install.
      - name: Testar o coletor
        run: npm test

      - name: Coletar cupons
        run: npm run collect

      - name: Salvar no repositório se algo mudou
        run: |
          git add data/coupons.json
          if git diff --cached --quiet; then
            echo "Nenhum cupom novo ou removido."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Cupons atualizados"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
