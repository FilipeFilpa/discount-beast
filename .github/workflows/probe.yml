name: probe
on:
  push:
    branches: ['claude/**']
    paths: ['scripts/probe.mjs', '.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: node scripts/probe.mjs
