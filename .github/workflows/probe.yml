# TEMPORÁRIO: sonda de fontes novas de cupons. Será removido antes do merge.
name: Sonda de fontes
on:
  push:
    branches: [claude/project-thread-sn5ulb]
    paths: ['probe/urls.txt']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./probe/probe.sh
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f probe/out
          git commit -m "Sonda: resultados" || exit 0
          git push origin HEAD:claude/project-thread-sn5ulb
